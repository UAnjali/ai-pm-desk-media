name: Exact-time dispatcher

# GitHub's scheduler can drop runs for hours, so this does not rely on any one of them.
# Twice an hour (off-minutes) a short run checks the calendar. Whenever a post is due within
# 24 hours, the run stays awake and starts its own next run before it ends (a relay that
# does not go through the scheduler), and it re-triggers anything that did not happen.
# One run at a time; a newer waiting run replaces an older one, and duplicates are harmless.
on:
  schedule:
    - cron: "13 * * * *"
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only verify the token and list upcoming events; trigger nothing"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write       # the relay starts this workflow's next run

concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Wait and trigger studio-engine
        env:
          STUDIO_ENGINE_TOKEN: ${{ secrets.STUDIO_ENGINE_TOKEN }}
          CHECK_ONLY: ${{ inputs.check_only }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 dispatcher/dispatch.py
